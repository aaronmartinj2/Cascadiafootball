<script>
(function(){
'use strict';

/* ================= SETUP ================= */
var cv=document.getElementById('c'), MAIN=cv.getContext('2d');
var LC=document.createElement('canvas'); LC.width=280; LC.height=494;
var ctx=LC.getContext('2d',{willReadFrequently:true}), LRS=280/420;
var W=420, H=740, F=900, SCALE=1;
function resize(){
  var s=Math.min(window.innerWidth/W, window.innerHeight/H);
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*s*dpr); cv.height=Math.round(H*s*dpr);
  cv.style.width=Math.round(W*s)+'px'; cv.style.height=Math.round(H*s)+'px';
  SCALE=s*dpr;
}
window.addEventListener('resize',resize); resize();

function rand(a,b){ return a+Math.random()*(b-a); }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/0.75; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

var STEP=1/240, REC_DT=1/120;
var GW=3.66, GH=2.44, BR=0.11, GRAV=9.81, NETD=2.0, NETTOP=2.0, KZ=-0.35, NEAR=0.3;

/* ================= CAMERA ================= */
var cam={x:0,y:1.85,z:-30,fx:0,fz:1,hor:230};
function look(x,y,z,lx,lz,hor){
  cam.x=x; cam.y=y; cam.z=z;
  var dx=lx-x, dz=lz-z, l=Math.sqrt(dx*dx+dz*dz)||1;
  cam.fx=dx/l; cam.fz=dz/l; cam.hor=hor;
}
function toCam(x,y,z){ var dx=x-cam.x, dz=z-cam.z; return [dx*cam.fz-dz*cam.fx, y-cam.y, dx*cam.fx+dz*cam.fz]; }
function proj(x,y,z){
  var c=toCam(x,y,z); if(c[2]<NEAR) return null;
  var s=F/c[2]; return {x:W/2+c[0]*s, y:cam.hor-c[1]*s, s:s, d:c[2]};
}
function depthOf(x,y,z){ return toCam(x,y,z)[2]; }
function clipPoly(p){
  var out=[];
  for(var i=0;i<p.length;i++){
    var a=p[i], b=p[(i+1)%p.length], ai=a[2]>=NEAR, bi=b[2]>=NEAR;
    if(ai) out.push(a);
    if(ai!==bi){ var t=(NEAR-a[2])/(b[2]-a[2]); out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, NEAR]); }
  }
  return out;
}
function poly3(pts,fill){
  var c=[]; for(var i=0;i<pts.length;i++) c.push(toCam(pts[i][0],pts[i][1],pts[i][2]));
  c=clipPoly(c); if(c.length<3) return;
  ctx.beginPath();
  for(var j=0;j<c.length;j++){ var s=F/c[j][2], x=W/2+c[j][0]*s, y=cam.hor-c[j][1]*s; if(j) ctx.lineTo(x,y); else ctx.moveTo(x,y); }
  ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
}
function seg3(x1,y1,z1,x2,y2,z2){
  var a=toCam(x1,y1,z1), b=toCam(x2,y2,z2);
  if(a[2]<NEAR&&b[2]<NEAR) return;
  if(a[2]<NEAR){ var t=(NEAR-a[2])/(b[2]-a[2]); a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,NEAR]; }
  else if(b[2]<NEAR){ var u=(NEAR-b[2])/(a[2]-b[2]); b=[b[0]+(a[0]-b[0])*u,b[1]+(a[1]-b[1])*u,NEAR]; }
  var sa=F/a[2], sb=F/b[2];
  ctx.moveTo(W/2+a[0]*sa, cam.hor-a[1]*sa); ctx.lineTo(W/2+b[0]*sb, cam.hor-b[1]*sb);
}

/* ================= SPRITES ================= */
function mkGlow(r,g,b){
  var c=document.createElement('canvas'); c.width=c.height=128;
  var x=c.getContext('2d'), gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+',1)'); gr.addColorStop(0.25,'rgba('+r+','+g+','+b+',0.45)'); gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  x.fillStyle=gr; x.fillRect(0,0,128,128); return c;
}
var GLOW_W=mkGlow(255,246,225), GLOW_GOLD=mkGlow(255,200,60), GLOW_FIRE=mkGlow(255,120,30), GLOW_CYAN=mkGlow(90,230,255);

/* ================= STADIUM GEOMETRY ================= */
var STANDS=[], CROWD={}, STARS=[];
var CROWD_COLS=['#2f8f46','#f5c518','#e9ecef','#1a3aff','#c41e2b','#4a5562','#7d8b99'];
(function(){
  var X=38, Z0=-68, Z1=10, O=18, Y0=1.0, Y1=13;
  STANDS.push([[-X,Y0,Z1],[X,Y0,Z1],[X+O,Y1,Z1+O],[-X-O,Y1,Z1+O]]);
  STANDS.push([[X,Y0,Z0],[-X,Y0,Z0],[-X-O,Y1,Z0-O],[X+O,Y1,Z0-O]]);
  STANDS.push([[-X,Y0,Z0],[-X,Y0,Z1],[-X-O,Y1,Z1+O],[-X-O,Y1,Z0-O]]);
  STANDS.push([[X,Y0,Z1],[X,Y0,Z0],[X+O,Y1,Z0-O],[X+O,Y1,Z1+O]]);
  for(var c=0;c<CROWD_COLS.length;c++) CROWD[CROWD_COLS[c]]=[];
  for(var s=0;s<STANDS.length;s++){
    var q=STANDS[s], n=s<2?380:420;
    for(var i=0;i<n;i++){
      var u=Math.random(), v=(Math.floor(Math.random()*20)+0.5)/20+rand(-0.012,0.012);
      var P=bil(q,u,v);
      var col=Math.random()<0.34?'#2f8f46':(Math.random()<0.3?'#f5c518':pick(CROWD_COLS));
      CROWD[col].push([P[0],P[1]+0.4,P[2],Math.random()*6.28]);
    }
  }
  for(var k=0;k<70;k++) STARS.push([Math.random(),Math.random()*0.12,Math.random()]);
})();
function bil(q,u,v){
  var A=q[0],B=q[1],C=q[2],D=q[3];
  var ix=lerp(A[0],B[0],u), iy=lerp(A[1],B[1],u), iz=lerp(A[2],B[2],u);
  var ox=lerp(D[0],C[0],u), oy=lerp(D[1],C[1],u), oz=lerp(D[2],C[2],u);
  return [lerp(ix,ox,v), lerp(iy,oy,v), lerp(iz,oz,v)];
}

/* ================= AUDIO ================= */
var AC=null, master=null, NB=null, crowdG=null, rainG=null, muted=false;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; return; }
  master=AC.createGain(); master.gain.value=muted?0:0.85; master.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  var d=NB.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  var s=AC.createBufferSource(); s.buffer=NB; s.loop=true;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=650; f.Q.value=0.5;
  crowdG=AC.createGain(); crowdG.gain.value=0.05;
  s.connect(f); f.connect(crowdG); crowdG.connect(master); s.start();
  var s2=AC.createBufferSource(); s2.buffer=NB; s2.loop=true;
  var f2=AC.createBiquadFilter(); f2.type='highpass'; f2.frequency.value=2600;
  rainG=AC.createGain(); rainG.gain.value=0;
  s2.connect(f2); f2.connect(rainG); rainG.connect(master); s2.start(0,0.7);
}
function nz(o){
  if(!AC) return;
  var t=AC.currentTime+(o.delay||0), a=o.a||0.01, d=o.d||0.2;
  var s=AC.createBufferSource(); s.buffer=NB; s.loop=true;
  var fl=AC.createBiquadFilter(); fl.type=o.type||'bandpass'; fl.frequency.setValueAtTime(o.f||1000,t);
  if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+a+d);
  fl.Q.value=o.q||1;
  var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.2,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+a+d+0.05);
}
function tone(o){
  if(!AC) return;
  var t=AC.currentTime+(o.delay||0), a=o.a||0.005, d=o.d||0.2;
  var os=AC.createOscillator(); os.type=o.type||'sine'; os.frequency.setValueAtTime(o.f,t);
  if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+a+d);
  var g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(o.g||0.2,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  os.connect(g); g.connect(master); os.start(t); os.stop(t+a+d+0.05);
}
var SFX={
  kick:function(p){ tone({f:150,f2:42,g:0.8,d:0.18}); nz({f:2600,type:'highpass',g:0.3,a:0.002,d:0.05}); nz({f:1400,f2:300,q:0.7,g:0.1+p*0.1,a:0.03,d:0.5}); },
  whistle:function(){ tone({f:2850,type:'triangle',g:0.13,a:0.01,d:0.16}); tone({f:2850,type:'triangle',g:0.13,a:0.01,d:0.4,delay:0.22}); },
  post:function(){ tone({f:620,g:0.3,d:1.0}); tone({f:1475,g:0.14,d:0.8}); tone({f:2240,g:0.08,d:0.6}); nz({f:4000,type:'highpass',g:0.2,a:0.001,d:0.04}); },
  net:function(){ nz({f:2800,type:'highpass',g:0.25,a:0.01,d:0.4}); },
  thud:function(){ tone({f:95,f2:50,g:0.55,d:0.14}); nz({f:500,type:'lowpass',g:0.3,a:0.003,d:0.1}); },
  roar:function(k){ nz({f:900,f2:650,q:0.45,g:0.5*k,a:0.12,d:3.0}); nz({f:380,type:'lowpass',g:0.3*k,a:0.2,d:2.6}); },
  groan:function(){ nz({f:520,f2:230,q:1.4,g:0.2,a:0.12,d:1.4}); },
  ooh:function(){ nz({f:420,f2:760,q:1.6,g:0.18,a:0.25,d:1.0}); },
  tap:function(){ tone({f:200,f2:90,g:0.35,d:0.08}); nz({f:1800,type:'highpass',g:0.08,a:0.002,d:0.04}); },
  /* chiptune jingles */
  notes:function(seq,type,g,step,dur,base){ for(var i=0;i<seq.length;i++) if(seq[i]) tone({f:seq[i],type:type||'square',g:g||0.06,d:dur||step*0.9,delay:(base||0)+i*step}); },
  goalJingle:function(big){
    SFX.notes([523,659,784,1047,784,1047],'square',0.06,0.085,0.09,0.25);
    SFX.notes([262,330,392,523,392,523],'triangle',0.1,0.085,0.09,0.25);
    tone({f:1047,type:'square',g:0.05,d:0.55,delay:0.76}); tone({f:1319,type:'square',g:0.04,d:0.55,delay:0.76}); tone({f:523,type:'triangle',g:0.12,d:0.6,delay:0.76});
    if(big) SFX.notes([1568,1319,1568,2093],'square',0.04,0.07,0.08,1.25);
  },
  missJingle:function(){ SFX.notes([392,370,330,262],'square',0.045,0.12,0.13,0.15); SFX.notes([196,185,165,131],'triangle',0.08,0.12,0.13,0.15); },
  overJingle:function(){ SFX.notes([523,392,330,392,262],'square',0.05,0.16,0.18,0.5); SFX.notes([262,196,165,196,131],'triangle',0.1,0.16,0.3,0.5); },
  hiJingle:function(){ SFX.notes([392,523,659,784,659,784,1047],'square',0.05,0.1,0.11,0.4); SFX.notes([196,262,330,392,330,392,523],'triangle',0.1,0.1,0.11,0.4); tone({f:1047,type:'square',g:0.04,d:0.6,delay:1.1}); },
  clap:function(d,g){ nz({f:1500,type:'highpass',g:g||0.09,a:0.003,d:0.06,delay:d}); nz({f:900,q:2,g:(g||0.09)*0.6,a:0.003,d:0.05,delay:d+0.012}); },
  snare:function(g){ nz({f:1900,q:0.8,g:g,a:0.002,d:0.05}); tone({f:190,f2:150,type:'triangle',g:g*0.6,d:0.04}); },
  blip:function(){ tone({f:880,type:'square',g:0.05,d:0.06}); tone({f:1320,type:'square',g:0.05,d:0.08,delay:0.07}); }
};
/* crowd chant: clap-clap, clap-clap-clap plus a little 'ole' melody, looped while lining up */
var chantNext=0, chantBar=0;
function chantTick(){
  if(!AC||muted) return;
  if(chantNext<AC.currentTime) chantNext=AC.currentTime+0.15;
  while(chantNext<AC.currentTime+0.4){
    var d=chantNext-AC.currentTime, beats=[0,0.38,0.95,1.15,1.35];
    for(var i=0;i<beats.length;i++) SFX.clap(d+beats[i],0.07);
    if(chantBar%2===0){ var mel=[330,330,392,370,330]; for(var j=0;j<mel.length;j++){ tone({f:mel[j],type:'triangle',g:0.035,d:0.16,delay:d+beats[j]}); tone({f:mel[j]*2,type:'square',g:0.012,d:0.12,delay:d+beats[j]}); } }
    chantBar++; chantNext+=2.3;
  }
}
function crowdLevel(v){ if(crowdG&&AC) crowdG.gain.setTargetAtTime(v,AC.currentTime,0.25); }
var muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',function(e){
  e.stopPropagation(); muted=!muted; initAudio();
  if(master) master.gain.value=muted?0:0.85;
  muteBtn.textContent=muted?'SOUND OFF':'SOUND ON';
});

/* ================= GAME STATE ================= */
var state='title', T=0;
var score=0, best=0, goals=0, lives=3, streak=0, level=1, kicks=0, topBinsCount=0, newBest=false;
try{ best=parseInt(localStorage.getItem('topbins_best'),10)||0; }catch(e){ best=0; }
var SCORES=null, lastInit='';
try{ SCORES=JSON.parse(localStorage.getItem('topbins_table')); lastInit=localStorage.getItem('topbins_init')||''; }catch(e){ SCORES=null; }
if(!SCORES||!SCORES.length){
  SCORES=[['CFC',2500],['TOP',2000],['BIN',1600],['GOL',1300],['CAS',1000],['KNX',800],['DIP',600],['WAL',450],['KEP',300],['NET',150]].map(function(r){ return {n:r[0],s:r[1]}; });
  if(best>0){ SCORES.push({n:'YOU',s:best}); SCORES.sort(function(a,b){ return b.s-a.s; }); SCORES=SCORES.slice(0,10); }
}
best=SCORES[0].s;
function saveScores(){ try{ localStorage.setItem('topbins_table',JSON.stringify(SCORES)); localStorage.setItem('topbins_best',String(SCORES[0].s)); }catch(e){} }
function qualifies(s){ return s>0&&(SCORES.length<10||s>SCORES[SCORES.length-1].s); }
function rankOf(s){ var r=0; while(r<SCORES.length&&SCORES[r].s>=s) r++; return r; }
function ordinal(n){ return n+(n===1?'ST':(n===2?'ND':(n===3?'RD':'TH'))); }
var KEYS='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['DEL','END']);
var KG={x0:28,y0:362,w:52,h:50,cols:7};
function entryKey(k){
  if(!entry) return;
  if(k==='DEL'){ entry.chars=entry.chars.slice(0,-1); SFX.tap(); }
  else if(k==='END'){ if(entry.chars.length) confirmEntry(); }
  else if(entry.chars.length<3){ entry.chars+=k; SFX.blip(); if(entry.chars.length===3) entry.ready=true; }
}
function entryTap(pt){
  var col=Math.floor((pt.x-KG.x0)/KG.w), row=Math.floor((pt.y-KG.y0)/KG.h);
  if(col<0||col>=KG.cols||row<0||row>3) return;
  var k=KEYS[row*KG.cols+col]; if(k) entryKey(k);
}
function confirmEntry(){
  var name=(entry.chars+'---').slice(0,3), r=rankOf(score);
  SCORES.splice(r,0,{n:name,s:score}); SCORES=SCORES.slice(0,10); hl=r;
  best=SCORES[0].s; lastInit=entry.chars; saveScores();
  try{ localStorage.setItem('topbins_init',lastInit); }catch(e){}
  entry=null; state='over'; overT=0; SFX.whistle();
}
var start={x:0,z:-24}, kf={x:0,z:1}, kr={x:1,z:0}, kickDist=24, wind=0;
var ball=null, keeper=null, wall=[], shot=null, mate=null, lo=null, fromLayoff=false, layoffErr=0, wallSide=1, wallAlong=9.15, camA=null, camSnap=true, camSpot=null, lastDt=0.016, lier=null, wallHint='', wallLatMin=0, wallLatMax=0, shotTag=null;
var decided=false, result='', postT=0, simAcc=0, ts=1, slowT=0;
var frames=[], recAcc=0, rp=null, trail=[], replayCount=0;
var bulge={a:0,x:0,y:1};
var banners=[], parts=[], flashA=0, flashCol='255,210,80', shake=0, cheer=0, flashes=[];
var drag=null, overT=0, camProg=0;
var rainy=false, rainA=0, weatherLevel=0, drops=[], splashes=[], rainAud=0, goalFrameT=-1, rollT=0, entry=null, hl=-1;
for(var di=0;di<170;di++) drops.push({x:Math.random()*W,y:Math.random()*H,l:rand(14,28),s:rand(560,820)});

var SKINS=['#f0c7a0','#c98c5f','#8a5a3c','#e2b48d','#a8714b'], HAIRS=['#2a1a10','#5a3a20','#111111','#c08a40'];
var KIT_WALL={shirt:'#c41e2b',trim:'#ffffff',shorts:'#f2f2f2',sock:'#c41e2b'};
var KIT_GK={shirt:'#d4ff1f',trim:'#1b1b1b',shorts:'#1b1b1b',sock:'#d4ff1f',skin:'#dca57f',hair:'#2a1a10'};
var KIT_ME={shirt:'#1a3aff',trim:'#f5c518',shorts:'#f2f2f2',sock:'#1a3aff',skin:'#e2b48d',hair:'#3a2410'};

function newBall(){
  return {x:start.x,y:BR,z:start.z,vx:0,vy:0,vz:0,ax:0,az:0,spin:0,spinRate:0,t:0,
          kChecked:false,crossed:false,inNet:false,blocked:false,wood:'',saved:false,caught:false,held:false,g:GRAV,kn:null,passedWall:false,under:false,croc:false};
}

/* named free-kick spots. w = weight at level 1 / 2 / 3+ ; bonus = extra points for scoring from there */
var SPOTS=[
  {id:'d',     name:'THE D',          w:[4,3,2], bonus:0,   wall:1,  pos:function(){ return [rand(-2.2,2.2), -rand(17.9,20.5)]; }},
  {id:'chan',  name:'CHANNEL',        w:[4,4,3], bonus:25,  wall:0,  pos:function(s){ return [s*rand(6,11), -rand(18.2,22.5)]; }},
  {id:'wide',  name:'EDGE OF THE BOX',w:[1,2,3], bonus:50,  wall:0,  pos:function(s){ return [s*rand(14.5,19.5), -rand(17.9,20.2)]; }},
  {id:'long',  name:'LONG RANGE',     w:[1,2,3], bonus:25,  wall:-1, pos:function(){ return [rand(-5,5), -rand(29,34)]; }},
  {id:'tight', name:'TIGHT ANGLE',    w:[0,1,2], bonus:100, wall:-2, pos:function(s){ return [s*rand(21.4,24), -rand(8.5,12)]; }}
];
var spot=SPOTS[0], lastSpotId='', spotT=0;
function pickSpot(){
  var li=Math.min(level,3)-1, tot=0, i;
  for(i=0;i<SPOTS.length;i++) if(SPOTS[i].id!==lastSpotId) tot+=SPOTS[i].w[li];
  var r=Math.random()*tot;
  for(i=0;i<SPOTS.length;i++){ if(SPOTS[i].id===lastSpotId) continue; r-=SPOTS[i].w[li]; if(r<=0) return SPOTS[i]; }
  return SPOTS[0];
}
function spotLabel(){
  var side=(spot.id==='chan'||spot.id==='wide'||spot.id==='tight')?(start.x<0?'LEFT ':'RIGHT '):'';
  var nm=spot.id==='chan'?side+'CHANNEL':(spot.id==='wide'?'EDGE OF BOX '+side.trim():(spot.id==='tight'?'TIGHT ANGLE '+side.trim():spot.name));
  return nm+'  '+Math.round(kickDist)+'M';
}
function setupKick(){
  level=1+Math.floor(goals/4);
  spot=pickSpot(); lastSpotId=spot.id;

/* ================= SHOOTING ================= */
/* where (sideways) the ball will pass the wall: used by the wall to flinch */
function predictWallLat(){
  var p={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz}, dt=1/120;

function predict(useCurl){
  var p={x:ball.x,y:ball.y,z:ball.z,vx:ball.vx,vy:ball.vy,vz:ball.vz};
  var ax=useCurl?ball.ax:0, az=useCurl?ball.az:0, dt=1/120;
  for(var i=0;i<600;i++){

var TYPE_INFO={dipper:{label:'DIPPER',col:'190,120,255'},knuckle:{label:'KNUCKLEBALL',col:'255,255,255'},
               layoff:{label:'LAY-OFF',col:'120,255,170'},bender:{label:'BENDER',col:'255,215,80'},normal:{label:'',col:'120,230,255'}};

/* turn a swipe into an aim: where it goes, how hard, how it bends, what kind of shot */
function readSwipe(pts,spot){
  if(!pts||pts.length<2) return null;

  var bs=spot?proj(spot.x,BR,spot.z):proj(ball.x,ball.y,ball.z), gb=proj(0,0,0), gm=proj(0,GH/2,0);

  var tsx=bs.x+dx*1.3*ggain, a=(tsx-W/2)/F, b=(cam.hor-gm.y)/F;
  var dX=cam.fx+cam.fz*a, dZ=Math.max(cam.fz-cam.fx*a,0.05), tt=-cam.z/dZ;

function shoot(pts){

  if(type==='dipper') speed+=2; if(type==='knuckle') speed+=3; if(type==='chip') speed=Math.max(13,speed-1);

  shot={pw:pw,curl:curl,dist:kickDist,type:type}; shot.wl=predictWallLat();

/* ================= LAY-OFF ROUTINE ================= */
function wallSpots(sx,sz,side,n){
  var l=Math.sqrt(sx*sx+sz*sz), fx=-sx/l, fz=-sz/l, rx=fz, rz=-fx;
  var nx=side*GW-sx, nz=-sz, nl=Math.sqrt(nx*nx+nz*nz); nx/=nl; nz/=nl;
  var latN=9.15*(nx*rx+nz*rz)/(nx*fx+nz*fz), sg=latN>0?-1:1, out=[];
  for(var i=0;i<n;i++){ var lat=latN-sg*0.32+sg*i*0.58; out.push([sx+fx*9.15+rx*lat, sz+fz*9.15+rz*lat]); }
  return out;
}
function startLayoff(){
  var to={x:mate.bx,z:mate.bz}, dx=to.x-ball.x, dz=to.z-ball.z;
  lo={t:0,from:{x:ball.x,z:ball.z},to:to,dur:Math.max(0.62,Math.sqrt(dx*dx+dz*dz)/3.4),queued:null,relT:0,arrived:false,perfect:false};
  var ws=wallSpots(to.x,to.z,wallSide,wall.length);
  for(var i=0;i<wall.length;i++){ wall[i].tx=ws[i][0]; wall[i].tz=ws[i][1]; }
  if(lier){ lier.tx=(ws[0][0]+ws[ws.length-1][0])/2; lier.tz=(ws[0][1]+ws[ws.length-1][1])/2; }
  lo.kx=keeper.x0+(to.x-start.x)*0.3;
  camSpot=to; state='layoff'; drag=null;
  SFX.tap(); shotTag={text:'LAY-OFF!',col:'rgb(120,255,170)',t:0};
}
function layoffStep(dt){
  lo.t+=dt;
  var u=clamp(lo.t/lo.dur,0,1), e=1-(1-u)*(1-u);
  ball.x=lerp(lo.from.x,lo.to.x,e); ball.z=lerp(lo.from.z,lo.to.z,e); ball.y=BR; ball.spin+=dt*14*(1-u);
  if(u>=1) lo.arrived=true;
  if(lo.t>0.2){
    var st=2.4*dt;
    for(var i=0;i<wall.length;i++){ var m=wall[i]; m.bx+=clamp(m.tx-m.bx,-st,st); m.bz+=clamp(m.tz-m.bz,-st,st); m.x=m.bx; m.z=m.bz; }
    if(lier){ lier.x+=clamp(lier.tx-lier.x,-st,st); lier.z+=clamp(lier.tz-lier.z,-st,st); }
  }
  var k=keeper; k.x+=clamp(lo.kx-k.x,-3*dt,3*dt);
  k.crouch=0.55+0.12*Math.sin(T*9); k.c=lerp(0.95,0.8,k.crouch);

}
function relock(){
  start={x:lo.to.x,z:lo.to.z};

  kf={x:-start.x/kickDist,z:-start.z/kickDist}; kr={x:kf.z,z:-kf.x};
  wallLatMin=1e9; wallLatMax=-1e9; var al=0;
  for(var i=0;i<wall.length;i++){
    var m=wall[i], lat=(m.bx-start.x)*kr.x+(m.bz-start.z)*kr.z;

function strikeLayoff(){

function layoffFail(kind){

/* ================= PHYSICS ================= */
function jumpCurve(t){ var u=t-0.1; return (u<0||u>0.5)?0:Math.sin(Math.PI*u/0.5); }
function memberJump(m,t){ return m.jump?jumpCurve(t)*m.jp:0; }
function wallPos(m,t){

  var r=clamp(t-0.05,0,0.5)*6.5; return [m.bx-kf.x*r, m.bz-kf.z*r];
}

function keeperAim(r){
  var k=keeper; r=clamp(r,0,1);
  var px=lerp(k.gx,k.trx,r), py=lerp(k.gy,k.try_,r);
  var cx=clamp(px,-(GW-0.3),GW-0.3);
  if(Math.abs(px)>GW+0.8||py>GH+0.9) cx=k.x0+(cx-k.x0)*0.35;
  k.tx=cx; k.tc=clamp(py-0.35,0.3,1.55); k.dir=cx>k.x0?1:-1;
}
function keeperStep(dt){

    k.moodT+=dt;

      k.rot*=Math.exp(-dt*5); k.dive=Math.max(0,k.dive-dt*2.5); k.crouch=Math.max(0,k.crouch-dt*3); k.vx=0;
      var tc2=k.mood===1?0.5:0.95; k.c+=(tc2-k.c)*Math.min(1,dt*4);
      k.arm=k.mood===2?Math.min(1,k.arm+dt*4):Math.max(0,k.arm-dt*4);

    }
  }
  if(k.t<k.rt){

    k.x+=clamp(k.tx-k.x,-1,1)*0.3*dt;

}

function phys(dt){
  var b=ball; b.t+=dt;
  if(state==='flight') keeperStep(dt);

  if(b.y<BR){
    b.y=BR; b.kn=null; b.g=GRAV;

      var keep=rainy?0.96:0.85; b.vy=-b.vy*(rainy?0.32:0.45); b.vx*=keep; b.vz*=keep; b.spinRate*=0.7;
      if(rainy) splashes.push({x:b.x,z:b.z,t:0,big:1});
    }
    else { b.vy=0; var fr=1-(rainy?1.1:1.8)*dt; b.vx*=fr; b.vz*=fr; b.spinRate*=fr;
      if(rainy&&Math.random()<dt*20&&(b.vx*b.vx+b.vz*b.vz)>4) splashes.push({x:b.x,z:b.z,t:0,big:0}); }
  }

    var wx=b.x-m.x, wz=b.z-m.z, d=Math.sqrt(wx*wx+wz*wz), top=m.h+jh;
    if(d<0.27+BR&&b.y<top+BR*0.6&&b.y+BR>jh+0.03&&d>0.0001){

    var rx=b.x-lier.x, rz=b.z-lier.z, al=rx*kr.x+rz*kr.z, pe=rx*kf.x+rz*kf.z, dyl=b.y-0.17, dd=Math.sqrt(pe*pe+dyl*dyl);
    if(Math.abs(al)<lier.half&&dd<0.2+BR&&dd>0.0001){
      var q1=pe/dd, q2=dyl/dd, vpe=b.vx*kf.x+b.vz*kf.z, vn2=vpe*q1+b.vy*q2;
      if(vn2<0){ var imp=-1.5*vn2; b.vx+=imp*q1*kf.x; b.vz+=imp*q1*kf.z; b.vy+=imp*q2; }
      b.vx*=0.6; b.vz*=0.6;
      b.x=lier.x+kr.x*al+kf.x*q1*(0.2+BR); b.z=lier.z+kr.z*al+kf.z*q1*(0.2+BR); b.y=0.17+q2*(0.2+BR);
      if(!b.blocked){ SFX.thud(); shake=Math.max(shake,0.3); }
      b.blocked=true; b.croc=true; b.kn=null;
      if(b.vz<4) decide('block');
    }
  }
  if(!b.passedWall){
    var along=(b.x-start.x)*kf.x+(b.z-start.z)*kf.z;
    if(along>=wallAlong){
      b.passedWall=true;
      var latB=(b.x-start.x)*kr.x+(b.z-start.z)*kr.z;
      if(!b.blocked&&latB>wallLatMin-0.35&&latB<wallLatMax+0.35&&b.y<0.45) b.under=true;
    }
  }

  /* keeper */
  if(!b.kChecked&&pz<KZ&&b.z>=KZ){
    b.kChecked=true;
    var k=keeper, rx=lerp(0.55,1.05,k.dive), ry=lerp(1.1,0.62,k.dive);
    /* soft, floating balls are easy for a keeper: bigger effective reach, and he holds on */
    var bsp=Math.sqrt(b.vx*b.vx+b.vy*b.vy+b.vz*b.vz), soft=bsp<18?1+(18-bsp)/18*1.7:1;
    rx*=soft; ry*=soft;
    var ex=(b.x-k.x)/rx, ey=(b.y-(k.c+0.35))/ry, e=ex*ex+ey*ey;
    if(e<1&&state==='flight'&&soft>1.12&&e<0.9&&rainy&&Math.random()<0.25){
      /* wet ball: it squirms through his gloves */
      b.spill=true; b.vz=Math.abs(b.vz)*0.22+0.9; b.vx*=0.2; b.vy=-0.6; b.ax=b.az=0; b.kn=null; b.g=GRAV;
      SFX.thud(); SFX.ooh();
    }
    else if(e<1&&state==='flight'&&soft>1.12&&e<0.9){
      b.saved=true; b.caught=true; b.held=true; b.vx=b.vy=b.vz=0; b.ax=b.az=0; b.kn=null;
      SFX.thud(); decide('save');
    }
    else if(e<1&&state==='flight'){
      b.saved=true; b.tip=e>0.6;
      b.vz=-Math.abs(b.vz)*0.22-1; b.vy=Math.abs(b.vy)*0.3+rand(1,3.5);
      b.vx=b.vx*0.3+(b.x>k.x?1:-1)*rand(2,5); b.ax=0; b.az=0; b.kn=null; b.g=GRAV;
      SFX.thud(); decide('save');
    }
  }

  /* woodwork */
  if(Math.abs(b.z)<0.4){
    for(var s=-1;s<=1;s+=2){
      var px=b.x-s*GW, d2=Math.sqrt(px*px+b.z*b.z);
      if(d2<BR+0.06&&b.y<GH+0.06&&d2>0.0001){
        var n1=px/d2, n2=b.z/d2, v1=b.vx*n1+b.vz*n2;
        if(v1<0){ b.vx-=1.7*v1*n1; b.vz-=1.7*v1*n2; hitWood('post'); }
        b.x=s*GW+n1*(BR+0.061); b.z=n2*(BR+0.061);
      }
    }
    if(Math.abs(b.x)<GW){
      var dyb=b.y-GH, d3=Math.sqrt(dyb*dyb+b.z*b.z);
      if(d3<BR+0.06&&d3>0.0001){
        var m1=dyb/d3, m2=b.z/d3, v2=b.vy*m1+b.vz*m2;
        if(v2<0){ b.vy-=1.7*v2*m1; b.vz-=1.7*v2*m2; hitWood('bar'); }
        b.y=GH+m1*(BR+0.061); b.z=m2*(BR+0.061);
      }
    }
  }

  /* goal line */
  if(!b.crossed&&pz<0&&b.z>=0){
    b.crossed=true; b.cx=b.x; b.cy=b.y;
    if(Math.abs(b.x)<GW-BR*0.3&&b.y<GH-BR*0.3&&!b.saved){ b.inNet=true; SFX.net(); decide('goal'); }
    else decide(b.y>=GH-BR*0.3?'over':'wide');
  }

  /* net */
  if(b.inNet){
    var maxZ=NETD-BR, topY=GH-(GH-NETTOP)*clamp(b.z/NETD,0,1);
    if(b.z>maxZ){ bulge.a=Math.min(0.55,Math.abs(b.vz)*0.025+0.18); bulge.x=b.x; bulge.y=b.y; b.z=maxZ; b.vz=-Math.abs(b.vz)*0.1; b.vx*=0.4; b.vy*=0.4; b.ax=0; b.az=0; b.kn=null; b.g=GRAV; }
    if(b.y>topY-BR){ b.y=topY-BR; b.vy=-Math.abs(b.vy)*0.2; }
    if(Math.abs(b.x)>GW-BR){ b.x=(b.x>0?1:-1)*(GW-BR); b.vx*=-0.2; }
    if(b.z<BR&&b.vz<0){ b.z=BR; b.vz=0; }
  }

  /* boards behind goal */
  if(b.z>7.3&&b.y<1.0&&b.vz>0){ b.vz=-b.vz*0.35; }

  if(!decided&&state==='flight'){
    var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy+b.vz*b.vz);
    if(b.t>3.2||(b.t>0.4&&sp<0.8&&b.y<=BR+0.01)) decide(b.blocked?'block':(b.wood?'woodout':'short'));
  }
}

function hitWood(kind){
  if(!ball.wood){ ball.wood=kind; SFX.post(); shake=Math.max(shake,0.6); SFX.ooh(); }
}

/* ================= RESULTS ================= */
function decide(kind){
  if(decided) return;
  decided=true; result=kind; postT=0;
  var b=ball;
  if(kind==='goal'){
    var tb=Math.abs(Math.abs(b.cx)-GW)<0.85&&b.cy>GH-0.85;
    var pts=100, tags=[], head='GOAL!';
    keeper.mood=1; keeper.moodT=0; goalFrameT=frames.length*REC_DT;
    if(b.spill) tags.push('KEEPER SPILL');
    if(tb){ pts*=2; topBinsCount++; tags.push('TOP BINS  x2'); if(lives<3){ lives++; tags.push('+1 BALL'); } }
    if(Math.abs(shot.curl)>8){ pts+=50; tags.push('BANANA KICK  +50'); }
    if(b.wood){ pts+=75; tags.push('OFF THE '+(b.wood==='post'?'POST':'BAR')+'  +75'); }
    if(b.blocked){ pts+=50; tags.push('DEFLECTION  +50'); }
    if(shot.type==='dipper'){ pts+=50; tags.push('DIPPER  +50'); }
    if(shot.type==='knuckle'){ pts+=75; tags.push('KNUCKLEBALL  +75'); }
    if(fromLayoff){ pts+=50; tags.push('LAY-OFF ROUTINE  +50'); if(lo&&lo.perfect){ pts+=50; tags.push('FIRST TIME  +50'); } }
    if(b.under){ pts+=75; tags.push('UNDER THE WALL  +75'); }
    if(spot.bonus&&!fromLayoff){ pts+=spot.bonus; tags.push(spot.name+'  +'+spot.bonus); }
    var db=Math.max(0,Math.round((shot.dist-20)*5)); if(db) { pts+=db; tags.push('RANGE  +'+db); }
    streak++; var mult=Math.min(1+0.5*(streak-1),4); pts=Math.round(pts*mult);
    score+=pts; goals++;
    if(tb) head='TOP BINS!';
    else if(b.spill) head='SPILLED IT!';
    else if(shot.dist>28||Math.abs(shot.curl)>11) head='GOLAZO!';
    else if(fromLayoff) head='WHAT A ROUTINE!';
    else if(shot.type==='knuckle') head='KNUCKLEBALL!';
    else if(b.under) head='UNDER THE WALL!';
    else if(shot.type==='dipper') head='DIPPER!';
    else if(b.wood) head='IN OFF THE '+(b.wood==='post'?'POST':'BAR')+'!';
    else if(shot.pw>0.95) head='WHAT A HIT!';
    var nl=1+Math.floor(goals/4);
    if(nl>level) tags.push('LEVEL UP!');
    if(tags.length>5) tags=tags.slice(tags.length-5);
    banner(head,'+'+pts+(mult>1?'   x'+mult:''),tags,tb?'#ffd23f':'#7dffa0');
    flashA=0.45; flashCol=tb?'255,210,80':'160,255,190'; shake=1.0; cheer=1; slowT=0.55;
    SFX.roar(tb?1.3:1); crowdLevel(0.16); SFX.goalJingle(tb);
    for(var i=0;i<26;i++) flashes.push({i:Math.random(),l:rand(0.1,1.6)});
    var gp=proj(b.cx,b.cy,0)||{x:W/2,y:260};
    burst(gp.x,gp.y,tb?140:90);
  } else {
    streak=0; lives--;
    var m={slow:'TOO SLOW!',scuff:'SCUFFED IT!',save:b.caught?'CLAIMED!':(b.tip?'FINGERTIP SAVE!':'SAVED!'),block:b.croc?'STOPPED BY THE CROC!':'BLOCKED!',wide:b.wood?'OFF THE POST!':'WIDE!',
           over:b.wood?'OFF THE BAR!':'OVER THE BAR!',woodout:b.wood==='bar'?'OFF THE BAR!':'OFF THE POST!',short:'NOT ENOUGH!'}[kind]||'MISS!';
    var sub=lives>0?(lives+(lives===1?' BALL LEFT':' BALLS LEFT')):'FINAL KICK';
    banner(m,sub,[], '#ff6b5e');
    if(kind!=='woodout'&&!b.wood) SFX.groan();
    if(kind==='save'){ keeper.mood=b.caught?3:2; keeper.moodT=0; }
    SFX.missJingle();
    crowdLevel(0.05);
  }
}
function banner(main,sub,tags,col){ banners=[{t:0,main:main,sub:sub,tags:tags,col:col}]; }
function burst(x,y,n){
  var cols=['#ffd23f','#38a84e','#ffffff','#5ff2ff','#1a3aff','#ff6b5e'];
  for(var i=0;i<n;i++){
    var a=rand(-Math.PI,0), sp=rand(150,560);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-120,l:rand(1.2,2.4),c:pick(cols),w:rand(3,7),h:rand(2,4),r:rand(0,6),vr:rand(-12,12)});
  }
}

function nextKick(){
  if(lives<=0){
    newBest=score>SCORES[0].s; hl=-1; crowdLevel(0.06);
    if(qualifies(score)){ state='entry'; overT=0; entry={chars:lastInit.slice(0,3),t:0,rank:rankOf(score)}; SFX.hiJingle(); }
    else { state='over'; overT=0; SFX.whistle(); SFX.overJingle(); }
    return;
  }
  setupKick();
}

/* ================= REPLAY ================= */
function snapLive(){
  var k=keeper;
  return {bx:ball.x,by:ball.y,bz:ball.z,sp:ball.spin,kx:k.x,kc:k.c,kd:k.dive,kr:k.dir,kt:ball.t,krot:k.rot,kcr:k.crouch,karm:k.arm,km:k.mood,kmt:k.moodT,
          ba:bulge.a,bbx:bulge.x,bby:bulge.y};
}
function startReplay(){
  if(frames.length<10){ nextKick(); return; }
  var mode=replayCount++%2, side=start.x>0?-1:1;
  rp={t:0,dur:(frames.length-1)*REC_DT,mode:mode,side:side};
  state='replay'; banners=[];
}
function replaySnap(){
  var fi=rp.t/REC_DT, i0=Math.min(Math.floor(fi),frames.length-1), i1=Math.min(i0+1,frames.length-1), f=fi-Math.floor(fi);
  var a=frames[i0], b=frames[i1], S={};
  for(var key in a){ if(a.hasOwnProperty(key)) S[key]=lerp(a[key],b[key],f); }
  var tr=[];
  for(var j=Math.max(0,i0-28);j<=i0;j+=2) tr.push([frames[j].bx,frames[j].by,frames[j].bz]);
  S.trail=tr; S.kicker=true; S.km=b.km; S.cel=(result==='goal'&&goalFrameT>=0&&rp.t>goalFrameT)?rp.t-goalFrameT:-1;
  return S;
}

/* ================= INPUT ================= */
function ptr(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H, t:performance.now()};
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault(); initAudio();
  if(state==='title'){ startGame(); return; }
  if(state==='entry'){ entryTap(ptr(e)); return; }
  if(state==='over'){ if(overT>1.0){ startGame(); } return; }
  if(state==='replay'){ nextKick(); return; }
  if(state==='layoff'){ if(!lo.queued&&lo.t>0.1){ drag={pts:[ptr(e)]}; try{ cv.setPointerCapture(e.pointerId); }catch(_){} } return; }
  if(state!=='aim') return;
  drag={pts:[ptr(e)]};
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
});
cv.addEventListener('pointermove',function(e){
  if(!drag) return; e.preventDefault();
  var p=ptr(e), l=drag.pts[drag.pts.length-1];
  if(Math.abs(p.x-l.x)+Math.abs(p.y-l.y)>2) drag.pts.push(p);
});
function endDrag(e){
  if(!drag) return;
  drag.pts.push(ptr(e));
  var pts=drag.pts; drag=null;
  if(state==='aim'){
    var A=readSwipe(pts);
    if(A&&A.type==='layoff') startLayoff(); else shoot(pts);
  } else if(state==='layoff'&&!lo.queued){
    lo.queued=pts; lo.relT=lo.t;
    if(lo.arrived) strikeLayoff();
  }
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',function(){ drag=null; });
document.addEventListener('keydown',function(e){
  if(state==='entry'){
    initAudio();
    if(/^[a-zA-Z]$/.test(e.key)) entryKey(e.key.toUpperCase());
    else if(e.key==='Backspace') entryKey('DEL');
    else if(e.key==='Enter') entryKey('END');
    e.preventDefault(); return;
  }
  if(e.key==='Enter'||e.key===' '){
    initAudio();
    if(state==='title') startGame();
    else if(state==='over'&&overT>1) startGame();
    else if(state==='replay') nextKick();
  }
});

/* ================= UPDATE ================= */
function update(dt){
  T+=dt;
  if(state==='flight'){
    var b=ball, onT=Math.abs(b.x)<GW+0.6&&b.y<GH+0.7;
    var target=1;
    if(!decided&&b.z>-4.5&&b.z<0.2&&onT&&b.vz>0) target=0.28;
    if(decided&&slowT>0){ target=0.35; slowT-=dt; }
    ts+=(target-ts)*Math.min(1,dt*10);
    simAcc+=dt*ts;
    var n=0;
    while(simAcc>=STEP&&n<80){
      phys(STEP); simAcc-=STEP; n++;
      recAcc+=STEP;
      if(recAcc>=REC_DT&&(!decided||postT<1.1)&&frames.length<760){ recAcc-=REC_DT; frames.push(snapLive()); }
    }
    trail.push([b.x,b.y,b.z]); if(trail.length>22) trail.shift();
    if(decided){
      postT+=dt*ts;
      var wait=result==='goal'?1.15:1.7;
      if(postT>wait){ if(result==='goal') startReplay(); else nextKick(); }
    }
    var trav=Math.sqrt((b.x-start.x)*(b.x-start.x)+(b.z-start.z)*(b.z-start.z));
    camProg+=(Math.min(trav*0.12,2.2)-camProg)*Math.min(1,dt*4);
  }
  else if(state==='layoff') layoffStep(dt);
  else if(state==='replay'){
    var fi=rp.t/REC_DT, fr=frames[Math.min(Math.floor(fi),frames.length-1)];
    var speed=(fr.bz>-6&&fr.bz<1)?0.22:0.45;
    rp.t+=dt*speed;
    bulge.a*=Math.exp(-dt*2.5);
    if(rp.t>=rp.dur+0.5) nextKick();
  }
  else if(state==='over'||state==='entry') overT+=dt;

  /* weather */
  rainA+=((rainy&&state!=='title'&&state!=='over'&&state!=='entry'?1:0)-rainA)*Math.min(1,dt*1.5);
  if(rainA>0.01){
    for(var dI=0;dI<drops.length;dI++){ var dr=drops[dI]; dr.y+=dr.s*dt; dr.x-=dr.s*0.16*dt; if(dr.y>H+20){ dr.y=-20-Math.random()*40; dr.x=Math.random()*(W+80); } if(dr.x<-20) dr.x+=W+60; }
    var nsp=dt*55*rainA; while(nsp>0){ if(Math.random()<nsp) splashes.push({x:rand(-30,30),z:rand(-55,6),t:0,big:0}); nsp-=1; }
  }
  for(var sI=splashes.length-1;sI>=0;sI--){ splashes[sI].t+=dt; if(splashes[sI].t>(splashes[sI].big?0.45:0.22)) splashes.splice(sI,1); }
  rainAud-=dt;
  if(rainAud<=0&&rainG&&AC){ rainG.gain.setTargetAtTime(0.11*rainA,AC.currentTime,0.3); rainAud=0.25; }

  /* sound: chant while lining up, drum roll as you wind up */
  if(state==='aim'||state==='layoff') chantTick();
  rollT-=dt;
  if(AC&&!muted&&rollT<=0){
    if(state==='aim'&&drag&&drag.pts.length>1){ var dd=(performance.now()-drag.pts[0].t)/1000; SFX.snare(Math.min(0.16,0.05+dd*0.25)); rollT=0.055; }
    else if(state==='layoff'&&!lo.queued){ var rem=Math.max(0,lo.dur-lo.t); SFX.snare(0.06+0.08*(1-Math.min(1,rem/lo.dur))); rollT=0.05+rem*0.12; }
  }

  if(state==='aim'){
    var kk=keeper, bob=Math.sin(T*7);
    kk.x+=(kk.x0+Math.sin(T*1.9)*0.14-kk.x)*Math.min(1,dt*6);
    kk.crouch=0.45+0.12*bob; kk.c=lerp(0.95,0.8,kk.crouch); kk.dive=0; kk.rot=0; kk.arm=0; kk.vx=0;
  }
  if(shotTag){ shotTag.t+=dt; if(shotTag.t>1.3) shotTag=null; }

  for(var i=banners.length-1;i>=0;i--){ banners[i].t+=dt; if(banners[i].t>2.4) banners.splice(i,1); }
  for(var j=parts.length-1;j>=0;j--){
    var p=parts[j]; p.l-=dt; p.vy+=520*dt; p.vx*=0.985; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
    if(p.l<=0||p.y>H+20) parts.splice(j,1);
  }
  for(var q=flashes.length-1;q>=0;q--){ flashes[q].l-=dt; if(flashes[q].l<=0) flashes.splice(q,1); }
  if(Math.random()<dt*(3+cheer*40)) flashes.push({i:Math.random(),l:0.08});
  flashA=Math.max(0,flashA-dt*1.4); shake=Math.max(0,shake-dt*2.2); cheer=Math.max(0,cheer-dt*0.35);
}

/* ================= CAMERA PER STATE ================= */
function setCamera(S){
  if(state==='title'||state==='over'||state==='entry'){
    var a=T*0.07, R=30;
    look(Math.sin(a)*R,4.2,-14-Math.cos(a)*R,0,-14,215);
  } else if(state==='replay'){
    if(rp.mode===0){
      look(rp.side*2.4,2.9,6.8, start.x*0.4, start.z*0.55, 235);
    } else {
      var px=start.x-kf.x*7+kr.x*rp.side*3, pz=start.z-kf.z*7+kr.z*rp.side*3;
      look(px,6.2,pz, lerp(0,S.bx,0.25), lerp(-2,S.bz,0.15), 150);
    }
  } else {
    var sp=camSpot||start, sl=Math.sqrt(sp.x*sp.x+sp.z*sp.z)||1, fx=-sp.x/sl, fz=-sp.z/sl;
    var tx=sp.x-fx*5.2, tz=sp.z-fz*5.2;
    if(!camA||camSnap){ camA={x:tx,z:tz,fx:fx,fz:fz}; camSnap=false; }
    var ck=Math.min(1,lastDt*3.5);
    camA.x+=(tx-camA.x)*ck; camA.z+=(tz-camA.z)*ck; camA.fx+=(fx-camA.fx)*ck; camA.fz+=(fz-camA.fz)*ck;
    look(camA.x+camA.fx*camProg,1.85-camProg*0.04,camA.z+camA.fz*camProg, lerp(0,S.bx,0.18), 0, 230);
  }
}

/* ================= DRAW: WORLD (16-bit painted style) ================= */
var PITCH_A=[58,148,52], PITCH_B=[72,166,62], FOG=[150,172,188];
function fogCol(c,d){ var f=clamp((d-30)/170,0,0.3); return 'rgb('+Math.round(lerp(c[0],FOG[0],f))+','+Math.round(lerp(c[1],FOG[1],f))+','+Math.round(lerp(c[2],FOG[2],f))+')'; }

/* --- painting helpers --- */
function cLG(x0,y0,x1,y1,st){ var g=ctx.createLinearGradient(x0,y0,x1,y1); for(var i=0;i<st.length;i++) g.addColorStop(st[i][0],st[i][1]); return g; }
function cEll(x,y,rx,ry,col,rot){ ctx.beginPath(); ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,6.2832); ctx.fillStyle=col; ctx.fill(); }
function cPoly(pts,fill){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++){ var p=pts[i]; if(p.length===4) ctx.quadraticCurveTo(p[0],p[1],p[2],p[3]); else ctx.lineTo(p[0],p[1]); } ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
function cSeg(x0,y0,x1,y1,w,col){ ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineWidth=w; ctx.strokeStyle=col; ctx.lineCap='round'; ctx.stroke(); }
var SKP=[{hi:'#f6cfa8',b:'#dda577',sh:'#a5683f'},{hi:'#c98d5c',b:'#9a6236',sh:'#623a1c'},{hi:'#a8714b',b:'#7a4a2a',sh:'#4a2a14'},
         {hi:'#f8d6b4',b:'#e6b48a',sh:'#ad7650'},{hi:'#d89a68',b:'#ad7146',sh:'#6e4426'}];

'>':['#...','.#..','..#.','...#','..#.','.#..','#...'],'<':['...#','..#.','.#..','#...','.#..','..#.','...#'],
'?':['.###.','#...#','....#','...#.','..#..','.....','..#..'],' ':['..','..','..','..','..','..','..']};
function glyph(ch){ return FONT[ch]||FONT[' ']; }
function textW(s,px){ s=String(s).toUpperCase(); var w=0; for(var i=0;i<s.length;i++) w+=glyph(s[i])[0].length+1; return Math.max(0,w-1)*px; }
/* sz <= 0 means an explicit pixel scale (-sz). Otherwise mapped from the old font size. */
function txt(s,x,y,sz,col,al,sh){
  s=String(s).toUpperCase();
  var sp=sz<=0?-sz:(sz<=9?1:(sz<=16?2:(sz<=26?3:4)));
  var m=ctx.getTransform(), px=Math.max(1,Math.round(sp*m.a/LRS));
  var dx=m.a*x+m.c*y+m.e, dy=m.b*x+m.d*y+m.f, w=textW(s,px);
  if(al==='center') dx-=w/2; else if(al==='right') dx-=w;
  dx=Math.round(dx); dy=Math.round(dy-7*px);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  var pass=function(ox,oy,cc){
    ctx.fillStyle=cc; var cx=dx+ox;
    for(var k=0;k<s.length;k++){ var g=glyph(s[k]);
      for(var r=0;r<7;r++){ var row=g[r]; for(var q=0;q<row.length;q++) if(row.charCodeAt(q)===35) ctx.fillRect(cx+q*px,dy+oy+r*px,px,px); }
      cx+=(g[0].length+1)*px; }
  };
  if(sh!==false){ var so=Math.max(1,Math.round(px/2)); pass(so,so,typeof sh==='string'?sh:'rgba(6,8,30,0.9)'); }
  pass(0,0,col);
  ctx.restore();
}
function miniBall(x,y,on){
  if(on){ paintBall(x,y,7,0.4); ctx.strokeStyle='rgba(10,14,40,0.8)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,7,0,6.2832); ctx.stroke(); }
  else { ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y,6.5,0,6.2832); ctx.stroke(); }
}
function hudBox(x,y,w,h){
  ctx.fillStyle='#0a0e48'; ctx.fillRect(x,y,w,h);
  var g=ctx.createLinearGradient(0,y,0,y+h); g.addColorStop(0,'#6a82f8'); g.addColorStop(0.14,'#3a4ad8'); g.addColorStop(0.6,'#2c3cc4'); g.addColorStop(1,'#1c2a9c');
  ctx.fillStyle=g; ctx.fillRect(x+2,y+2,w-4,h-4);
}
function hudFlag(x,y,cols,vert){
  ctx.fillStyle='#000'; ctx.fillRect(x-1.5,y-1.5,33,21);
  for(var i=0;i<3;i++){ ctx.fillStyle=cols[i]; if(vert) ctx.fillRect(x+i*10,y,10,18); else ctx.fillRect(x,y+i*6,30,6); }
}
/* gold cup for the high score */
function hudTrophy(cx,cy){
  var m=['.##########.','############','#.########.#','#.########.#','.#.######.#.','..########..','...######...','....####....','.....##.....','.....##.....','...######...','..########..'];
  var px=2, x0=cx-m[0].length*px/2, y0=cy-m.length*px/2;
  ctx.fillStyle='#0a0e48'; ctx.fillRect(x0-2,y0-2,m[0].length*px+4,m.length*px+4);
  for(var r=0;r<m.length;r++) for(var q=0;q<m[r].length;q++) if(m[r][q]==='#'){
    ctx.fillStyle=r>=10?'#a86a10':(q<5&&r<8?'#fff0a0':(q>8?'#c88a18':'#ffd23f')); ctx.fillRect(x0+q*px,y0+r*px,px,px);
  }
}
function drawHUD(){
  hudBox(6,6,200,46); hudFlag(14,20,['#1e5fc8','#f2f2ee','#2a8a3e']);
  txt('SCORE',54,24,8,'#a8d8ff'); txt(String(score),54,46,14,'#fff23a','left','#b01818');
  hudBox(214,6,200,46); hudTrophy(237,29);
  txt('BEST',262,24,8,'#a8d8ff'); txt(String(Math.max(best,score)),262,46,14,'#fff23a','left','#b01818');
  ctx.fillStyle='rgba(10,14,72,0.82)'; ctx.fillRect(W/2-96,58,192,26);
  for(var i=0;i<3;i++) miniBall(W/2-78+i*19,71,i<lives);
  txt('LEVEL '+level,W/2+86,77,8,'#ffffff','right');
  if(rainy){ var ix=W/2-6, iy=64; ctx.fillStyle='#c8d4e2'; ctx.fillRect(ix,iy+3,16,6); ctx.fillRect(ix+3,iy,9,4); ctx.fillStyle='#8fd3ff';
    for(var ri=0;ri<3;ri++) ctx.fillRect(ix+2+ri*5,iy+11+((Math.floor(T*6)+ri)%3)*2,2,3); }
  if(state==='aim'||state==='flight'||state==='layoff'){
    var lab=spotLabel(), lw=textW(lab,1)/LRS+16, pulse=state==='aim'?Math.max(0,1-(T-spotT)*1.5):0;
    ctx.fillStyle='rgba(10,14,72,0.82)'; ctx.fillRect(W/2-lw/2,90,lw,20);
    ctx.fillStyle='rgba(255,210,63,'+(0.9*pulse)+')'; ctx.fillRect(W/2-lw/2,90,lw,20);
    txt(lab,W/2,105,8,pulse>0.5?'#0a0e48':'#ffd23f','center',false);
  }
  if(streak>1){
    var m=Math.min(1+0.5*(streak-1),4);
    txt('STREAK X'+m,W/2,126,8,'#ffd23f','center','#5a3000');
  }
  if(wind&&(state==='aim'||state==='flight')){
    var dir=wind>0?1:-1, n=Math.min(3,Math.ceil(Math.abs(wind)/1.5)), y=146;
    txt('WIND',W/2-30,y,7,'#ffffff','right','#0a0e48');
    for(var k=0;k<n;k++){
      var x=W/2-14+k*10*dir+(dir<0?20:0);
      ctx.fillStyle='rgba(255,255,255,'+(0.55+0.45*Math.sin(T*6-k))+')';
      ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x+7*dir,y-4); ctx.lineTo(x,y); ctx.closePath(); ctx.fill();
    }
    txt(Math.abs(wind).toFixed(1),W/2+34,y,7,'#ffffff','left','#0a0e48');
  }
}

function drawAimUI(){
  var bp=proj(ball.x,ball.y,ball.z), spot=state==='layoff'?lo.to:null;
  if(spot){
    var sp2=proj(spot.x,BR,spot.z), rem=lo.dur-lo.t;
    if(sp2&&!lo.queued){
      var good=Math.abs(rem)<0.15, rr=BR*sp2.s*1.6+Math.max(0,rem)*110;
      ctx.strokeStyle=good?'#7dffa0':'rgba(255,255,255,0.8)'; ctx.lineWidth=good?4:2;
      ctx.beginPath(); ctx.arc(sp2.x,sp2.y,rr,0,6.2832); ctx.stroke();
      ctx.strokeStyle='rgba(125,255,160,0.5)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(sp2.x,sp2.y,BR*sp2.s*1.6,0,6.2832); ctx.stroke();
    }
    if(!drag&&!lo.queued&&Math.floor(T*6)%2===0) txt('HIT IT FIRST TIME!',W/2,H-80,11,'#7dffa0','center');
    if(!drag&&!lo.queued) txt('SWIPE AS THE RINGS MEET',W/2,H-58,7,'#cfd8e0','center');
  }
  else if(bp){
    var r=BR*bp.s*(1.9+0.25*Math.sin(T*5));
    ctx.strokeStyle='rgba(95,242,255,'+(0.45+0.3*Math.sin(T*5))+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(bp.x,bp.y,r,0,6.2832); ctx.stroke();
  }
  if(!drag){
    if(!spot){
      if(wallHint) txt(wallHint,W/2,H-100,7,'#ffb3a8','center');
      if(Math.floor(T*2)%2===0) txt('SWIPE TO SHOOT',W/2,H-78,10,'#ffffff','center');
      txt('CURVE = BEND  -  SLOW = LAY-OFF',W/2,H-58,7,'#8fd3ff','center');
    }
  } else {
    var A=readSwipe(drag.pts,spot);
    if(A&&spot&&A.type==='layoff') A.type='normal';
    if(A&&A.type==='layoff'){
      txt('LAY-OFF',W/2,H-110,10,'#7dffa0','center');
    } else if(A){
      var rp2=proj(A.tx,A.ty,0);
      if(rp2){
        var inG=Math.abs(A.tx)<GW-0.1&&A.ty<GH-0.05, col=inG?'#7dffa0':'#ff6b5e', rr=9+2*Math.sin(T*12);
        ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(rp2.x,rp2.y,rr,0,6.2832);
        ctx.moveTo(rp2.x-rr-6,rp2.y); ctx.lineTo(rp2.x-rr+3,rp2.y); ctx.moveTo(rp2.x+rr-3,rp2.y); ctx.lineTo(rp2.x+rr+6,rp2.y);
        ctx.moveTo(rp2.x,rp2.y-rr-6); ctx.lineTo(rp2.x,rp2.y-rr+3); ctx.moveTo(rp2.x,rp2.y+rr-3); ctx.lineTo(rp2.x,rp2.y+rr+6); ctx.stroke();
        ctx.fillStyle=col; ctx.fillRect(rp2.x-1.5,rp2.y-1.5,3,3);
      }
      var info=TYPE_INFO[A.type];
      var bw=180, bx=W/2-bw/2, by=H-118, f=clamp(A.pw/1.3,0,1);
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx-3,by-3,bw+6,14);
      var pg=ctx.createLinearGradient(bx,0,bx+bw,0); pg.addColorStop(0,'#38a84e'); pg.addColorStop(0.65,'#ffd23f'); pg.addColorStop(0.85,'#ff8a3d'); pg.addColorStop(1,'#ff3d3d');
      ctx.fillStyle=pg; ctx.fillRect(bx,by,bw*f,8);
      ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillRect(bx+bw*(1.1/1.3),by-3,2,14);
      txt('POWER',bx,by-8,7,'#cfd8e0','left');
      if(info.label) txt(info.label,bx+bw,by-8,7,'rgb('+info.col+')','right');
    }
  }
  if(kicks===0&&!drag&&bp&&!spot){
    /* ghost tutorial swipe */
    var corner=proj(-(GW-0.4)*(start.x>0?1:-1),GH-0.4,0);
    if(corner){
      var ex=bp.x+(corner.x-bp.x)/1.45, ey=bp.y+(corner.y-bp.y)/1.45;
      var mx=(bp.x+ex)/2+(start.x>0?-55:55), my=(bp.y+ey)/2;
      var t=(T%1.8)/1.4; if(t>1) t=1;
      ctx.setLineDash([4,6]); ctx.strokeStyle='rgba(255,255,255,0.45)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(bp.x,bp.y); ctx.quadraticCurveTo(mx,my,ex,ey); ctx.stroke(); ctx.setLineDash([]);
      var qx=(1-t)*(1-t)*bp.x+2*(1-t)*t*mx+t*t*ex, qy=(1-t)*(1-t)*bp.y+2*(1-t)*t*my+t*t*ey;
      ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.arc(qx,qy,9,0,6.2832); ctx.fill();
    }
  }
  if(drag&&drag.pts.length>1){
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.lineJoin='round';
    var pts=drag.pts;
    for(var w=3;w>=1;w--){
      ctx.strokeStyle=w===1?'rgba(255,255,255,0.9)':'rgba(95,242,255,'+(0.18*w)+')'; ctx.lineWidth=w===1?3:w*6;
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawBanners(){
  for(var i=0;i<banners.length;i++){
    var b=banners[i], t=b.t, a=t<1.9?1:Math.max(0,1-(t-1.9)/0.5);
    var sp=Math.max(2,Math.min(4,Math.floor(400/(b.main.length*9))));
    var sc=1+1.4*Math.exp(-t*10);
    ctx.save(); ctx.globalAlpha=a; ctx.translate(W/2,268); ctx.scale(sc,sc);
    for(var k=4;k>=1;k--) txt(b.main,k*1.2,k*1.2,-sp,'#140a00','center',false);
    txt(b.main,0,0,-sp,b.col,'center',false);
    ctx.restore();
    ctx.save(); ctx.globalAlpha=a*clamp((t-0.15)*4,0,1);
    txt(b.sub,W/2,308,13,'#ffffff','center');
    for(var j=0;j<b.tags.length;j++){
      var ta=clamp((t-0.3-j*0.12)*5,0,1); ctx.globalAlpha=a*ta;
      txt(b.tags[j],W/2,336+j*20,8,b.tags[j]==='LEVEL UP!'?'#5ff2ff':'#ffd23f','center');
    }
    ctx.restore();
  }
}

function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i]; ctx.save(); ctx.globalAlpha=Math.min(1,p.l*1.5);
    ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
  }
}

  var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'rgba(2,4,10,0.55)'); g.addColorStop(0.5,'rgba(2,4,10,0.35)'); g.addColorStop(1,'rgba(2,4,10,0.85)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  txt('CASCADIA FOOTBALL PRESENTS',W/2,118,7,'#6fd38a','center');

  for(var k=5;k>=1;k--) txt('TOP',W/2+k*1.5,196+k*1.5+bob,-7,'#062a3a','center',false);

  var lines=[['SWIPE UP TO SHOOT','#ffffff'],['CURVE THE SWIPE = BENDER','#ffd23f'],['FLICK AT THE END = DIPPER','#c79bff'],
             ['FAST + DEAD STRAIGHT = KNUCKLEBALL','#ffffff'],['SLOW SWIPE = LAY-OFF, THEN STRIKE','#8dffb5'],
             ['GOLD RINGS x2 - TOP BINS = +1 BALL','#ffd23f'],['3 MISSES = FULL TIME','#ff8a7e']];
  for(var i=0;i<lines.length;i++) txt(lines[i][0],W/2,356+i*21,i===3?7:8,lines[i][1],'center');
  if(Math.floor(T*2.2)%2===0) txt('TAP TO KICK OFF',W/2,548,12,'#7dffa0','center');

    ctx.fillStyle='rgba(255,255,255,0.18)'; ctx.fillRect(x+4,y+4,KG.w-8,3);

function drawReplayUI(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,58); ctx.fillRect(0,H-58,W,58);
  if(Math.floor(T*2)%2===0){ ctx.fillStyle='#ff2d2d'; ctx.beginPath(); ctx.arc(24,30,6,0,6.2832); ctx.fill(); }
  txt('REPLAY',38,35,11,'#ffffff','left',false);
  txt(rp.mode===0?'GOAL CAM':'SKY CAM',W-16,35,8,'#9fb3c8','right',false);
  txt('TAP TO SKIP',W/2,H-24,8,'#9fb3c8','center',false);
}

/* ================= MAIN LOOP ================= */
function draw(){
  var S;
  if(state==='replay') S=replaySnap();
  else { S=snapLive(); S.trail=state==='flight'?trail:null; S.kicker=false; }
  setCamera(S);
  ctx.setTransform(LRS,0,0,LRS,0,0);
  ctx.save();
  if(shake>0.01) ctx.translate((Math.random()-0.5)*shake*14,(Math.random()-0.5)*shake*14);
  drawWorld(S);
  ctx.restore();
  pixelPass();
  ctx.setTransform(LRS,0,0,LRS,0,0);
  flushTags();
  if(flashA>0){ ctx.fillStyle='rgba('+flashCol+','+flashA+')'; ctx.fillRect(0,0,W,H); }
  if(state==='title') drawTitle();
  else if(state==='over'){ drawHUD(); drawOver(); }
  else if(state==='entry'){ drawEntry(); }
  else if(state==='replay'){ drawReplayUI(); }
  else {
    drawHUD(); if(state==='aim'||state==='layoff') drawAimUI();
    if(shotTag&&(state==='flight'||state==='layoff')){
      var sa=clamp(1.3-shotTag.t,0,1), ss=1+0.6*Math.exp(-shotTag.t*12);
      ctx.save(); ctx.globalAlpha=sa; ctx.translate(W/2,H-110); ctx.scale(ss,ss); txt(shotTag.text,0,0,14,shotTag.col,'center'); ctx.restore();
    }
  }
  drawBanners(); drawParts();
  MAIN.setTransform(1,0,0,1,0,0); MAIN.imageSmoothingEnabled=false;
  MAIN.drawImage(LC,0,0,cv.width,cv.height);
}

var last=0;
function loop(now){
  if(!last) last=now;
  var dt=Math.min((now-last)/1000,0.05); last=now; lastDt=dt;
  update(dt); draw();
  requestAnimationFrame(loop);
}
setupKick(); state='title';
requestAnimationFrame(loop);

})();
